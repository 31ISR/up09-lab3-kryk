{% extends 'layout.html' %} {% block title %} Посты {% endblock %}
{% block content %}
<section>
    <h1>Посты</h1>

    {% for post in posts %}
    <article class="post">
        <h2>
            <a href="{%  url 'posts:page' slug=post.slug %}"> {{ post.title }} </a>
        </h2>
        <p class="date">{{ post.date }}</p>
        <p class="txt">{{ post.body }}</p>
    </article>
    {% endfor %}
</section>
{% endblock %}
